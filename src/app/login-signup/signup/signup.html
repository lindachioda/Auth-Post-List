
<form #formsignup="ngForm" (ngSubmit)="onSubmit(formsignup)">

<div class="form-floating mb-3">
  <input type="name" name="name" ngModel required class="form-control" id="floatingName" placeholder="Nome" >
  <label for="floatingName">Nome</label>
</div>

<div class="form-floating mb-3">
  <input type="ruolo" name="ruolo" ngModel required class="form-control" id="floatingRuolo" placeholder="Ruolo">
  <label for="floatingRuolo">Ruolo</label>
  <option>admin / user</option>
</div>

<div class="form-floating mb-3">
  <input type="email" name="email" ngModel required class="form-control" id="floatingEmail" placeholder="name@example.com">
  <label for="floatingEmail">Email address</label>
</div>

<div class="form-floating">
  <input type="password" name="password" ngModel required class="form-control" id="floatingPassword" placeholder="Password">
  <label for="floatingPassword">Password</label>
</div>

<button type="submit" class="btn btn-primary" [disabled]="!formsignup.valid">Registra</button>

</form>
